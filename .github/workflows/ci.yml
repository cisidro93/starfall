name: Starfall CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test StarfallGalaxy & Build Unsigned iPad IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show Swift & Xcode versions
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Run StarfallGalaxy unit tests
        working-directory: StarfallGalaxy
        run: swift test -v

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Starfall iOS app (unsigned)
        run: |
          xcodebuild build \
            -project Starfall.xcodeproj \
            -scheme Starfall \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/Starfall.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Starfall.app not found at $APP_PATH"
            exit 1
          fi
          rm -rf Payload Starfall_Unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Starfall.app
          zip -qry Starfall_Unsigned.ipa Payload
          ls -lh Starfall_Unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starfall_Unsigned
          path: Starfall_Unsigned.ipa
          if-no-files-found: error
          retention-days: 30
