name: Starfall
options:
  bundleIdPrefix: com.chris
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"

packages:
  StarfallGalaxy:
    path: StarfallGalaxy

targets:
  Starfall:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StarfallApp
    dependencies:
      - package: StarfallGalaxy
        product: StarfallGalaxy
    info:
      path: StarfallApp/Info.plist
      properties:
        CFBundleDisplayName: Starfall
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chris.starfall
        PRODUCT_NAME: Starfall
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
